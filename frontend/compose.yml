name: j26-se-340_development
services:
  frontend:
    image: ciftron-frontend:local
    build: .
    container_name: frontend
    restart: unless-stopped
    init: true
    environment:
      GATEWAY_URL: http://gateway:4000
      HOST: 0.0.0.0
      PORT: "8080"
    ports: ["127.0.0.1:5173:8080"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
