# frontend/nginx.conf — serves the built app and forwards /api to the C4 gateway
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's own DNS. With a variable, nginx looks the gateway up on every request, so:
  #  - the web app still starts when the gateway is not up yet (no restart loop), and
  #  - a rebuilt gateway (new internal IP) is found again without restarting this container.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $gateway http://gateway:4000;

  location /api/ {
    proxy_pass $gateway;
    proxy_set_header Host $host;
    proxy_read_timeout 330s;          # recommendations can take a few minutes on CPU
    proxy_send_timeout 330s;
  }

  location / {
    try_files $uri /index.html;
  }
}
