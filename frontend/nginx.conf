# frontend/nginx.conf — serves the built app and forwards /api to the C4 gateway
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://gateway:4000;
    proxy_set_header Host $host;
    proxy_read_timeout 330s;          # recommendations can take a few minutes on CPU
    proxy_send_timeout 330s;
  }

  location / {
    try_files $uri /index.html;
  }
}
