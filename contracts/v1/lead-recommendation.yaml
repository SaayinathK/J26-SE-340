# I-05  Lead recommendation  — producer: C3 Lead Intelligence (Shathursini J)
openapi: 3.0.3
info: { title: "C3 Lead recommendation (I-05)", version: "1.0.0" }
servers: [ { url: "http://localhost:3001" } ]
paths:
  /leads/{lead_id}/recommendation:
    get:
      summary: Grounded next-best-action and message draft for one lead (RAG + Mistral 7B)
      parameters:
        - { in: path, name: lead_id, required: true, schema: { type: string } }
        - { in: header, name: X-Tenant-Id, required: true, schema: { type: string },
            description: "Set by the C4 gateway from the JWT. Another tenant's lead returns 404." }
      responses:
        "200":
          description: >
            Recommendation. If grounded is false, next_best_action and message_draft are null
            and must not be shown or sent. Latency 30-120 s on CPU; answers are cached.
          content:
            application/json:
              schema:
                type: object
                properties:
                  next_best_action: { type: string, nullable: true }
                  message_draft: { type: string, nullable: true }
                  sources:
                    type: array
                    items:
                      type: object
                      properties: { id: {type: string}, label: {type: string}, type: {type: string}, text: {type: string} }
                  confidence: { type: number }
                  grounded: { type: boolean }
                  policy_rule: { type: string, nullable: true }
                  policy_check: { type: string, enum: [consistent, inconsistent, no_policy_found] }
                  citation_method: { type: string, enum: [model_citation, post_hoc_attribution, none] }
                  lead_id: { type: string }
                  score: { type: integer }
                  segment: { type: string, enum: [hot, warm, cold] }
                  latency_sec: { type: number }
        "404": { description: Lead not found for this tenant }
        "503": { description: LLM service not reachable }