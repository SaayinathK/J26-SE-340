name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix frontend
      - run: npm ci --prefix services/gateway
      - run: npm ci --prefix services/email-agent
      - run: npm test --prefix frontend
      - run: node --test services/gateway/tests/unit/*.cjs
      - run: npm test --prefix services/email-agent
      - run: python -m unittest discover -s ml/email-agent/tests -p 'test_*.py' -v
      - run: npm run build --prefix frontend
