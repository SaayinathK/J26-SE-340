name: j26-se-340_development
services:
  gateway:
    image: ciftron-gateway:local
    build: .
    container_name: gateway
    restart: unless-stopped
    init: true
    env_file: [.env]
    environment:
      HOST: 0.0.0.0
      PORT: "4000"
      DB_HOST: gateway-database
      DB_PORT: "5432"
      DB_NAME: saas_platform
      NODE_ENV: development
      CLIENT_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      EMAIL_AGENT_INTERNAL_URL: http://email-agent:4001
      CONTENT_AGENT_INTERNAL_URL: http://content-agent:4002
      LEAD_INTEL_INTERNAL_URL: http://lead-intel:4003
      STRATEGY_FL_INTERNAL_URL: http://strategy-fl:4004
    ports: ["127.0.0.1:4000:4000"]
    depends_on:
      gateway-database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  gateway-database:
    image: pgvector/pgvector:pg16
    container_name: gateway-database
    restart: unless-stopped
    env_file: [db/.env]
    environment:
      POSTGRES_DB: saas_platform
      POSTGRES_USER: admin
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - gateway-data:/var/lib/postgresql/data
      - ../../docker/db-init/01-enable-pgvector.sql:/docker-entrypoint-initdb.d/01-enable-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U admin -d saas_platform"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  gateway-data:
    name: j26-se-340_development_c4_pgdata
